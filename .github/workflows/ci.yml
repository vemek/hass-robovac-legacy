---
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.5"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure generated protobuf stubs are committed
        run: bash scripts/verify_generated_proto_matches.sh

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: >-
          pip install --ignore-installed idna requests==2.32.4 pycares==4.11.0 protobuf==6.32.0
          pycryptodome six &&
          pip install --disable-pip-version-check --no-compile -r requirements-test.txt

      - name: Pytest (Home Assistant harness)
        run: env -u PYTHONPATH pytest tests --tb=short -q
